listener 1883

# Every client must log in; there is no anonymous access.
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

# Persist sessions and queued QoS 1 messages to disk so a broker restart
# doesn't drop messages queued for the ingestor's persistent session.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
