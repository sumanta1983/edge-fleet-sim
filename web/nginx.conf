server {
    listen 80;
    root /usr/share/nginx/html;

    # Same origin as the page, so the browser needs no CORS.
    location /api/ {
        proxy_pass http://api:8000/;   # trailing slash strips the /api prefix
        proxy_set_header Host $host;
    }

    # Client-side routing: unknown paths like /devices/edge-a1-01 get the app.
    location / {
        try_files $uri /index.html;
    }
}
